<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14254a">
<meta name="description" content="St. James H.S. School time table — class, teacher and master routine, period adjustment.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SJS Time Table">
<title>SJS Time Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<style>
:root{
  --navy:#14254a;--navy2:#1d3466;--gold:#c9a54a;--gold2:#f3e3b5;--red:#9b1c1c;
  --bg:#f3f5fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--sunk:#e8ecf5;
  --mon:#2563eb;--tue:#0d9488;--wed:#7c3aed;--thu:#d97706;--fri:#db2777;
  --free:#16a34a;--closed:#b45309;--sub:#7c3aed;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(86px + var(--safe-b))}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;box-shadow:0 6px 20px rgba(20,37,74,.25)}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 2px var(--gold);object-fit:cover}
.htxt{flex:1;min-width:0}
.htxt h1{margin:0;font-size:18px;font-weight:800}
.htxt p{margin:2px 0 0;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;gap:6px;align-items:center;border:0}
.pill.gold{background:var(--gold);color:var(--navy)}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dot.off{background:#94a3b8;box-shadow:none}
main{padding:14px 14px 0}
.sec{margin:18px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);padding:14px}
.hero{background:linear-gradient(135deg,#1d3466,#14254a 60%);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(201,165,74,.35),transparent 70%)}
.hero .k{font-size:12px;color:#c7d2fe;font-weight:600}
.hero .big{font-size:28px;font-weight:800;line-height:1.1;margin:4px 0}
.hero .sub{font-size:13px;color:#e0e7ff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fde68a);border-radius:99px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.abs{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(15,23,42,.08)}
.seg button.today:after{content:"•";color:var(--gold);margin-left:3px}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:stretch}
.room{background:#fff7ed;border:2px solid #fdba74;border-radius:16px;padding:8px 14px;text-align:center;min-width:86px}
.room b{display:block;font-size:28px;color:#9a3412;line-height:1}
.room span,.ctc span{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.ctc{background:#ecfdf5;border:2px solid #6ee7b7;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center}
.ctc b{font-size:17px;color:#065f46}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:12px;align-items:stretch;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,23,42,.05);border-left:5px solid var(--dc,#2563eb);position:relative}
.prow.now{box-shadow:0 0 0 2.5px var(--gold),0 8px 20px rgba(201,165,74,.25)}
.prow.now:before{content:"NOW";position:absolute;right:10px;top:-9px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px}
.prow.edit{cursor:pointer}
.pnum{width:52px;flex:none;text-align:center;border-right:1px dashed var(--line);padding-right:10px;display:flex;flex-direction:column;justify-content:center}
.pnum b{font-size:20px;font-weight:800;color:var(--navy);line-height:1}
.pnum small{font-size:10px;color:var(--mut);font-weight:700;margin-top:4px;line-height:1.3}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.subj{font-size:16px;font-weight:800;color:var(--navy)}
.tch{font-size:13px;font-style:italic;color:var(--dc,#2563eb);margin-top:2px}
.prow.closed{background:#fffbeb;border-left-color:var(--closed)}
.prow.closed .subj{color:var(--closed);letter-spacing:2px}
.prow.free{background:#f0fdf4;border-left-color:var(--free)}
.prow.free .subj{color:var(--free)}
.prow.subst{background:#f5f3ff;border-left-color:var(--sub)}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#fef3c7;color:#92400e;margin-left:6px;vertical-align:middle;font-style:normal;letter-spacing:0}
.tag.v{background:#ede9fe;color:#5b21b6}
.brk{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11.5px;font-weight:700;margin:-2px 6px}
.brk:before,.brk:after{content:"";flex:1;border-top:1.5px dashed #cbd5e1}
.grid{overflow-x:auto;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05)}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:11.5px}
.tt th{background:var(--navy);color:#fff;padding:8px 4px;font-weight:800}
.tt th small{display:block;color:var(--gold2);font-weight:600;font-size:9.5px}
.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:middle;line-height:1.25}
.tt td.d{color:#fff;font-weight:800;font-size:11px;position:sticky;left:0;z-index:1}
.tt td b{color:var(--navy);display:block}
.tt td i{color:var(--mut);font-size:10.5px}
.tt td.cl{background:#fffbeb;color:var(--closed);font-weight:800}
.tt td.fr{background:#f0fdf4}
.tt td.nowc{box-shadow:inset 0 0 0 2px var(--gold)}
select.big,input.big,textarea.big{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--navy)}
textarea.big{font-weight:500;font-size:13px;min-height:200px;font-family:ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--navy)}
.stat span{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat.warn b{color:#b91c1c}.stat.ok b{color:var(--free)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.dayb{text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.dayb .col{height:64px;background:#eef2f7;border-radius:10px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.dayb .col i{display:block;width:100%;border-radius:10px}
.freegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ft{background:#fff;border-radius:14px;padding:10px 12px;border-left:4px solid var(--free);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.ft b{display:block;font-size:13.5px;color:var(--navy)}
.ft span{font-size:11px;color:var(--mut)}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.mrow .c{width:62px;font-weight:800;color:#3730a3;font-size:14px}
.mrow .s{flex:1;font-weight:800;color:var(--navy);font-size:14px}
.mrow .t{font-style:italic;color:#b45309;font-size:12.5px;text-align:right;max-width:46%}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:var(--sunk);color:var(--navy)}
.btn.red{background:#fee2e2;color:#991b1b}
.btn.wa{background:#25d366;color:#fff}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;gap:10px}
.switch:last-child{border-bottom:0}
.tg{width:50px;height:30px;border-radius:99px;background:#cbd5e1;position:relative;border:0;cursor:pointer;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--free)}.tg.on:after{left:23px}
.timeinp{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:6px 0}
.timeinp input{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;width:100%}
.log{font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.erow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.erow input,.erow select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;width:100%;background:#fff}
.erow b{color:var(--navy);font-size:13.5px}
.erow3{grid-template-columns:64px 74px 1fr}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--navy);cursor:pointer;text-align:left}
.menu button:last-child{border-bottom:0}
.menu small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.adjp{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(15,23,42,.05);border-left:5px solid #ef4444;margin-bottom:10px}
.adjp h4{margin:0 0 2px;font-size:15px;color:var(--navy);display:flex;justify-content:space-between;gap:8px;align-items:center}
.slot{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.slot .p{font-weight:800;color:var(--navy);font-size:15px;text-align:center}
.slot .c{font-weight:800;color:#3730a3;font-size:13.5px}
.slot select{width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;background:#fff;margin-top:5px}
.slot select.pend{border-color:#fca5a5;background:#fff5f5}
.slot .done{color:var(--sub);font-weight:800;font-size:13.5px;margin-top:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#94a3b8;padding:6px 0;cursor:pointer;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--navy);background:#eef2fb}
.tab.on svg{color:var(--gold)}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--navy)}
.sheet label,.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.warn{background:#fef2f2;color:#991b1b;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.ok{background:#f0fdf4;color:#166534;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.banner{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.banner.blue{background:#e0e7ff;color:#3730a3}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1.5px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--mut);font-size:11px;padding:24px 10px 8px}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hrow">
      <img class="logo" alt="" src="logo.png">
      <div class="htxt"><h1>SJS Time Table</h1><p id="hsub"></p></div>
    </div>
    <div class="pills"><span class="pill gold" id="pSeason"></span><span class="pill" id="pClock"></span><span class="pill"><span class="dot off" id="pDot"></span><span id="pSync">This phone</span></span><span class="pill" id="pRole" style="display:none"></span></div>
  </header>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

  if(h){try{const c=JSON.parse(decodeURIComponent(escape(atob(h[1].replace(/-/g,'+').replace(/_/g,'/')))));if(c.apiKey&&c.projectId){LS.set('fb',c);history.replaceState(null,'',location.pathname)}}catch(e){}}
  const fromFile=window.SJS_FIREBASE&&window.SJS_FIREBASE.apiKey?window.SJS_FIREBASE:null;
  return fromFile||LS.get('fb',null);
}

  myClass:LS.get('myClass',null),myTeacher:LS.get('myTeacher',null),cls:LS.get('cls',null),teacher:LS.get('teacher',null)};
function savePref(k,v){pref[k]=v;LS.set(k,v)}

/* data getters: Excel base + admin changes */
const teachers=()=>S.main.teachers||BASE.teachers;
const classes=()=>S.main.classes||BASE.classes;
const subjects=()=>S.main.subjects||BASE.subjects;
const TM=()=>Object.fromEntries(teachers().map(t=>[t.c,t.n]));
const SM=()=>Object.fromEntries(subjects().map(s=>[s.c,s.n]));
const CM=()=>Object.fromEntries(classes().map(c=>[c.c,c]));
const season=()=>S.main.season||BASE.season.now||'Winter';
const timing=()=>{const s=season();return Object.assign({},BASE.season[s],(S.main.timings||{})[s]||{})};
const closedAt=(d,p)=>String(BASE.closed[d][p]||'').replace(/\s+/g,' ').trim();
const codes=t=>String(t||'').split('/').map(x=>x.trim()).filter(Boolean);
function cell(d,cls,p){const cl=closedAt(d,p);if(cl)return{closed:cl};
  const k=`${d}|${cls}|${p}`;const v=S.ov[k]||((BASE.grid[`${d}|${cls}`]||[])[p])||['',''];return{s:v[0]||'',t:v[1]||'',changed:!!S.ov[k]}}
function sname(c){if(!c)return'';const f=SM()[c]||c;if(pref.subj==='short')return c;if(pref.subj==='both'&&f!==c)return`${f} (${c})`;return f}
function tfull(c){return TM()[c]||c}
function tname(t){if(!t)return'';if(pref.tch==='short')return t;return codes(t).map(tfull).join(' / ')}
function busy(code,d,p){const out=[];for(const c of classes()){const x=cell(d,c.c,p);if(!x.closed&&codes(x.t).includes(code))out.push({cls:c.c,s:x.s})}return out}
function loadDay(code,d){let n=0;for(let p=0;p<7;p++)if(busy(code,d,p).length)n++;return n}

/* adjustments */
function adjFor(date){return S.adj[date]||null}
function subsFor(date){const a=adjFor(date);return(a&&a.subs)||{}}           // key "p|cls|absentCode" -> substitute code
function subAt(date,cls,p){const s=subsFor(date);for(const k in s){const[pp,c,ab]=k.split('|');if(+pp===p&&c===cls&&s[k])return{sub:s[k],absent:ab}}return null}
function subDutiesOf(date,code){const s=subsFor(date),out=[];for(const k in s)if(s[k]===code){const[p,c,ab]=k.split('|');out.push({p:+p,cls:c,absent:ab})}return out}
function absentList(date){const a=adjFor(date);return(a&&a.absent)||[]}

/* time */
function parseT(s){const m=String(s).match(/(\d{1,2}):(\d{2})\s*([AP]M)/gi);if(!m||m.length<2)return null;
  const f=x=>{const[,h,mi,ap]=x.match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);let H=+h%12;if(/p/i.test(ap))H+=12;return H*60+ +mi};return[f(m[0]),f(m[1])]}
function shortT(s){const m=String(s).match(/(\d{1,2}:\d{2})\s*[AP]M/gi);if(!m||m.length<2)return esc(s);const c=x=>x.replace(/\s*[AP]M/i,'');return`${c(m[0])}<br>${c(m[1])}`}
function now(){const d=new Date();return{dow:d.getDay(),min:d.getHours()*60+d.getMinutes(),sec:d.getSeconds(),date:d}}
function today(){const n=now();return n.dow>=1&&n.dow<=5?n.dow-1:-1}
const todayISO=()=>isoOf(new Date());
function nextSchoolISO(){const d=new Date();while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return isoOf(d)}
function nextP(per,m){for(let i=0;i<7;i++)if(per[i]&&per[i][0]>=m)return i;return -1}
function status(){const n=now(),d=today(),T=timing();const per=T.p.map(parseT),br=T.b.map(parseT);
  if(d<0)return{kind:'weekend',d:-1};
  for(let i=0;i<7;i++){const r=per[i];if(r&&n.min>=r[0]&&n.min<r[1])return{kind:'period',p:i,d,frac:(n.min-r[0]+n.sec/60)/(r[1]-r[0]),left:r[1]-n.min}}
  const names=['Devotion / Line-up','Recess','Lunch break'];
  for(let i=0;i<3;i++){const r=br[i];if(r&&n.min>=r[0]&&n.min<r[1])return{kind:'break',name:names[i],d,left:r[1]-n.min,next:nextP(per,n.min)}}
  const first=per.find(Boolean),last=[...per].reverse().find(Boolean);
  if(first&&n.min<first[0])return{kind:'before',d,next:0,inMin:first[0]-n.min};
  if(last&&n.min>=last[1])return{kind:'after',d};
  return{kind:'gap',d,next:nextP(per,n.min)}}
const fmtLeft=m=>m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
function longDate(iso){const d=toD(iso);return`${ord(d.getDate())} ${MN[d.getMonth()]}, ${d.getFullYear()}, ${DN[d.getDay()]}`}

/* ----- period rows ----- */
function periodRow(d,p,x,o={}){
  const st=status();const isNow=o.isToday&&st.kind==='period'&&st.d===d&&st.p===p;
  let body,cls='';
  if(x.closed){cls='closed';body=`<div class="subj">${esc(x.closed)}</div>`}
  else if(o.teacherView){
    if(x.subFor){cls='subst';body=`<div class="subj" style="font-size:20px">${esc(x.cls)}<span class="tag v">SUBSTITUTE</span></div><div class="tch" style="color:var(--sub);font-style:normal;font-weight:700">${esc(sname(x.s))} · for ${esc(tfull(x.subFor))}</div>`}
    else if(!x.cls){cls='free';body=`<div class="subj">FREE</div><div class="tch" style="color:var(--free)">No class this period</div>`}
    else body=`<div class="subj" style="font-size:20px">${esc(x.cls)}${x.absent?'<span class="tag">ON LEAVE</span>':''}</div><div class="tch" style="font-style:normal;font-weight:700">${esc(sname(x.s))}</div>`}
  else if(!x.s){cls='free';body=`<div class="subj">—</div><div class="tch" style="color:var(--free)">No subject</div>`}
  else if(x.sub){cls='subst';body=`<div class="subj">${esc(sname(x.s))}<span class="tag v">ADJUSTED</span></div><div class="tch" style="color:var(--sub)">${esc(tname(x.sub))} <span style="font-style:normal;color:var(--mut)">(for ${esc(tname(x.absent))})</span></div>`}
  else body=`<div class="subj">${esc(sname(x.s))}${x.changed?'<span class="tag">changed</span>':''}</div><div class="tch">${esc(tname(x.t))}</div>`;
  return`<div class="prow ${cls} ${isNow?'now':''} ${o.editable?'edit':''}" style="--dc:${DC[d]}" ${o.editable?`data-edit="${d}|${o.cls}|${p}"`:''}>
   <div class="pnum"><b>${PN[p]}</b><small>${shortT(timing().p[p]||'')}</small></div><div class="pbody">${body}</div></div>`}
function breaks(after){const b=timing().b;
  if(after===1)return`<div class="brk">Recess · ${esc(b[1]||'')}</div>`;if(after===3)return`<div class="brk">Lunch · ${esc(b[2]||'')}</div>`;return''}
function classDay(d,cls){const isT=d===today(),date=todayISO();let h='<div class="plist">';
  for(let p=0;p<7;p++){const x=cell(d,cls,p);if(isT&&!x.closed){const s=subAt(date,cls,p);if(s){x.sub=s.sub;x.absent=s.absent}}
    h+=periodRow(d,p,x,{editable:S.admin&&S.edit,cls,isToday:isT})+breaks(p)}return h+'</div>'}
function teacherCell(code,d,p,date){const cl=closedAt(d,p);if(cl)return{closed:cl};
  if(date){const du=subDutiesOf(date,code).find(x=>x.p===p);if(du){const x=cell(d,du.cls,p);return{cls:du.cls,s:x.s,subFor:du.absent}}}
  const b=busy(code,d,p);if(!b.length)return{};
  return{cls:b.map(x=>x.cls).join(' + '),s:b[0].s,absent:date&&absentList(date).some(a=>a.c===code)}}
function teacherDay(code,d){const isT=d===today(),date=isT?todayISO():null;let h='<div class="plist">';
  for(let p=0;p<7;p++)h+=periodRow(d,p,teacherCell(code,d,p,date),{teacherView:true,isToday:isT})+breaks(p);return h+'</div>'}
function dayTabs(key){const t=today();return`<div class="seg" data-seg="${key}">${DS.map((n,i)=>`<button data-day="${i}" class="${selDay[key]===i?'on':''} ${t===i?'today':''}">${n}</button>`).join('')}${key==='cls'?`<button data-day="w" class="${clsWeek?'on':''}">Week</button>`:''}</div>`}

/* ======================= TODAY ======================= */
function vNow(m){
  const st=status(),d=st.d,T=timing();let hero='';
  if(st.kind==='weekend')hero=`<div class="k">${DN[now().dow]}</div><div class="big">No classes today</div><div class="sub">Monday's routine is shown below.</div>`;
  else if(st.kind==='period')hero=`<div class="k">${DAYS[d]} · ${esc(T.p[st.p])}</div><div class="big">${PN[st.p]} period</div><div class="sub">${fmtLeft(st.left)} left${st.p<6?' · next: '+PN[st.p+1]+' at '+esc((T.p[st.p+1]||'').split('-')[0]):''}</div><div class="bar"><i style="width:${Math.min(100,st.frac*100).toFixed(1)}%"></i></div>`;
  else if(st.kind==='break')hero=`<div class="k">${DAYS[d]}</div><div class="big">${esc(st.name)}</div><div class="sub">${fmtLeft(st.left)} left${st.next>=0?' · then '+PN[st.next]+' period':''}</div>`;
  else if(st.kind==='before')hero=`<div class="k">${DAYS[d]} · school starts</div><div class="big">in ${fmtLeft(st.inMin)}</div><div class="sub">Devotion ${esc(T.b[0]||'')} · 1st period ${esc(T.p[0]||'')}</div>`;
  else if(st.kind==='after')hero=`<div class="k">${DAYS[d]}</div><div class="big">School is over</div><div class="sub">See you tomorrow!</div>`;
  else hero=`<div class="k">${DAYS[d]}</div><div class="big">Between periods</div><div class="sub">${st.next>=0?'Next: '+PN[st.next]:''}</div>`;
  const dd=d<0?0:d;
  const tdy=todayISO(),ab=d>=0?absentList(tdy):[],ns=Object.values(subsFor(tdy)).filter(Boolean).length;
  const adjCard=ab.length?`<div class="card" style="margin-top:12px;border-left:5px solid var(--sub)"><div class="row" style="justify-content:space-between"><b style="color:var(--navy)">Today's adjustments</b><button class="btn sm ghost" data-go="adj">Open</button></div><div class="note" style="margin-top:4px">${ab.length} teacher${ab.length>1?'s':''} on leave · ${ns} period${ns===1?'':'s'} adjusted</div></div>`:'';
  const cl=classes(),te=teachers();
  const who=pref.role==='class'?(pref.myClass||cl[0].c):(pref.myTeacher||te[0].c);
  let mine;
  if(pref.role==='class'){const c=CM()[who]||cl[0];mine=`<div class="info" style="margin-bottom:12px"><div class="room"><span>Room</span><b>${esc(c.room||'-')}</b></div><div class="ctc"><span>Class teacher</span><b>${esc(tfull(c.ct)||'-')}</b></div></div>`+classDay(dd,c.c)}
  else mine=teacherDay(who,dd);
  m.innerHTML=`<div class="card hero">${hero}</div>${adjCard}
   <div class="sec"><span>My routine · ${DAYS[dd]}</span></div>
   <div class="seg" style="margin-bottom:10px" id="roleSeg"><button data-role="class" class="${pref.role==='class'?'on':''}">I'm a student</button><button data-role="teacher" class="${pref.role==='teacher'?'on':''}">I'm a teacher</button></div>
   <select class="big" id="whoSel" style="margin-bottom:12px">${pref.role==='class'?cl.map(c=>`<option ${c.c===who?'selected':''} value="${esc(c.c)}">Class ${esc(c.c)}</option>`).join(''):te.map(t=>`<option ${t.c===who?'selected':''} value="${esc(t.c)}">${esc(t.n)} (${esc(t.c)})</option>`).join('')}</select>${mine}`;
  $('#roleSeg').onclick=e=>{const r=e.target.dataset.role;if(r){savePref('role',r);render()}};
  $('#whoSel').onchange=e=>{savePref(pref.role==='class'?'myClass':'myTeacher',e.target.value);render()};
}

/* ======================= ADJUST (teacher absence) ======================= */
function dayIdx(iso){const w=toD(iso).getDay();return w>=1&&w<=5?w-1:-1}
function curAdj(){if(A.draft&&A.draft.date===A.date)return A.draft;const a=adjFor(A.date);return a?JSON.parse(JSON.stringify(a)):{date:A.date,absent:[],subs:{}}}
function adjSlots(adj){const d=dayIdx(adj.date),out=[];if(d<0)return out;
  for(const a of adj.absent){const list=[];for(let p=0;p<7;p++){if(closedAt(d,p))continue;
      for(const b of busy(a.c,d,p))list.push({p,cls:b.cls,s:b.s,key:`${p}|${b.cls}|${a.c}`})}out.push({a,list})}return out}
function candidates(adj,p,key){const d=dayIdx(adj.date);const absent=new Set(adj.absent.map(a=>a.c));
  const taken=new Set(Object.entries(adj.subs||{}).filter(([k,v])=>v&&+k.split('|')[0]===p&&k!==key).map(([k,v])=>v));
  return teachers().filter(t=>!absent.has(t.c)&&!busy(t.c,d,p).length&&!taken.has(t.c))
    .map(t=>({...t,load:loadDay(t.c,d)+Object.values(adj.subs||{}).filter(v=>v===t.c).length})).sort((a,b)=>a.load-b.load||a.n.localeCompare(b.n))}
function autoAssign(adj){adj.subs=adj.subs||{};
  for(const g of adjSlots(adj))for(const s of g.list){if(adj.subs[s.key])continue;
    const c=candidates(adj,s.p,s.key);const knows=c.filter(t=>[0,1,2,3,4].some(dd=>{for(let q=0;q<7;q++){const x=cell(dd,s.cls,q);if(codes(x.t).includes(t.c))return true}return false}));
    const pick=(knows.length&&knows[0].load<=c[0].load+1)?knows[0]:c[0];if(pick)adj.subs[s.key]=pick.c}}
function waText(adj){const lines=[`*Substitution Routine: ${longDate(adj.date)}*`];
  for(const g of adjSlots(adj)){lines.push('',`(${tfull(g.a.c)}'s periods)${g.a.r&&g.a.r!=='Other'?' – '+g.a.r:''}`);
    if(!g.list.length)lines.push('No class periods');
    for(const s of g.list){const sub=(adj.subs||{})[s.key];lines.push(`${PN[s.p]}- ${s.cls} - ${sub?tfull(sub):'(pending)'}`)}}
  lines.push('',`– ${BASE.school.incharge?BASE.school.incharge+', ':''}Routine in-charge`,BASE.school.name);return lines.join('\n')}
function vAdjust(m){
  const seg=`<div class="seg" id="adjSeg" style="margin-bottom:12px"><button data-v="adj" class="${adjMode==='adj'?'on':''}">Period adjustment</button><button data-v="free" class="${adjMode==='free'?'on':''}">Free teachers</button></div>`;
  if(adjMode==='free'){vFree(m,seg);return}
  const adj=curAdj(),d=dayIdx(A.date),slots=adjSlots(adj);
  const total=slots.reduce((n,g)=>n+g.list.length,0),done=slots.reduce((n,g)=>n+g.list.filter(s=>(adj.subs||{})[s.key]).length,0);
  const canEdit=S.admin;
  let body='';
  if(d<0)body=`<div class="card empty">${DN[toD(A.date).getDay()]} — no school. Pick a school day.</div>`;
  else if(!adj.absent.length)body=`<div class="card empty">No teacher marked absent for this day.${canEdit?'<br><br><button class="btn gold" id="addAbs">+ Mark absent teacher</button>':'<br><span class="note">The Admin adds absent teachers here.</span>'}</div>`;
  else{
    body=`<div class="stats"><div class="stat"><b>${total}</b><span>To cover</span></div><div class="stat ${total-done?'warn':'ok'}"><b>${total-done}</b><span>Pending</span></div><div class="stat"><b>${adj.absent.length}</b><span>On leave</span></div></div>`;
    body+=`<div style="height:12px"></div>`+slots.map(g=>`<div class="adjp"><h4><span>${esc(tfull(g.a.c))} <span class="note">(${esc(g.a.c)})</span></span>${canEdit?`<button class="btn sm red" data-rmabs="${esc(g.a.c)}">Remove</button>`:''}</h4>
      <div class="note">${esc(g.a.r||'Other')} · ${g.list.length} period${g.list.length===1?'':'s'}</div>
      ${g.list.length?g.list.map(s=>{const sub=(adj.subs||{})[s.key];
        const sel=canEdit?`<select data-slot="${esc(s.key)}" class="${sub?'':'pend'}"><option value="">— pick substitute —</option>${candidates(adj,s.p,s.key).map(t=>`<option value="${esc(t.c)}" ${t.c===sub?'selected':''}>${esc(t.n)} (${esc(t.c)}) · ${t.load} today</option>`).join('')}${sub&&!candidates(adj,s.p,s.key).some(t=>t.c===sub)?`<option value="${esc(sub)}" selected>${esc(tfull(sub))} (busy!)</option>`:''}</select>`
          :`<div class="done">${sub?'→ '+esc(tfull(sub)):'<span style="color:#b91c1c">pending</span>'}</div>`;
        return`<div class="slot"><div class="p">${PN[s.p]}</div><div><span class="c">${esc(s.cls)}</span> <span class="note">· ${esc(sname(s.s))} · ${esc(timing().p[s.p]||'')}</span>${sel}</div></div>`}).join(''):'<div class="note" style="margin-top:6px">No class periods this day.</div>'}</div>`).join('');
    if(canEdit)body+=`<div class="row wrap" style="margin-top:4px"><button class="btn ghost" id="addAbs" style="flex:1">+ Absent teacher</button><button class="btn ghost" id="autoA" style="flex:1">⚡ Auto assign</button></div>
      <div class="row wrap" style="margin-top:10px"><button class="btn gold" id="saveAdj" style="flex:1" ${A.dirty?'':'disabled'}>${A.dirty?'Save & publish':'Saved ✓'}</button><button class="btn red" id="clrAdj">Clear day</button></div>`;
    body+=`<div class="sec"><span>Share with staff</span></div><div class="card"><div class="row wrap"><a class="btn wa" style="flex:1" id="waBtn" href="https://wa.me/?text=${encodeURIComponent(waText(adj))}" target="_blank" rel="noopener">${svg('wa').replace('<svg','<svg style="width:18px;height:18px"')} Share on WhatsApp</a><button class="btn ghost" id="cpBtn">Copy text</button></div>
      <p class="note" style="margin:8px 0 0">Choose your staff WhatsApp group after tapping Share. *Stars* show in bold.</p><textarea class="big" readonly style="margin-top:8px;min-height:160px">${esc(waText(adj))}</textarea></div>`}
  const hist=Object.keys(S.adj).sort().reverse().slice(0,10);
  m.innerHTML=seg+`<div class="row"><input type="date" class="big" id="adjDate" value="${A.date}" style="flex:1"><button class="btn ghost" id="adjToday">Today</button></div>
    <div class="sec"><span>${d>=0?longDate(A.date):'No school'}</span>${A.dirty?'<span style="color:#b45309">Not saved yet</span>':''}</div>${body}
    ${hist.length?`<div class="sec"><span>Adjustment register</span></div><div class="card">${hist.map(k=>{const a=S.adj[k];const n=Object.values(a.subs||{}).filter(Boolean).length;return`<div class="log"><span><b>${esc(longDate(k))}</b><br><span class="note">${(a.absent||[]).map(x=>esc(x.c)).join(', ')} · ${n} adjusted</span></span><button class="btn sm ghost" data-hist="${k}">Open</button></div>`}).join('')}</div>`:''}`;
  $('#adjSeg').onclick=e=>{const v=e.target.dataset.v;if(v){adjMode=v;render()}};
  $('#adjDate').onchange=e=>{if(A.dirty&&!confirm2())return;A.date=e.target.value||todayISO();A.draft=null;A.dirty=false;render()};
  $('#adjToday').onclick=()=>{A.date=nextSchoolISO();A.draft=null;A.dirty=false;render()};
  m.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{A.date=b.dataset.hist;A.draft=null;A.dirty=false;render();window.scrollTo({top:0})});
  const work=()=>{if(!A.draft||A.draft.date!==A.date)A.draft=curAdj();return A.draft};
  const ab=$('#addAbs');if(ab)ab.onclick=()=>absentSheet(work());
  const au=$('#autoA');if(au)au.onclick=()=>{autoAssign(work());A.dirty=true;render();toast('Substitutes filled — least busy teachers first')};
  m.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{const w=work();w.subs=w.subs||{};if(s.value)w.subs[s.dataset.slot]=s.value;else delete w.subs[s.dataset.slot];A.dirty=true;render()});
  m.querySelectorAll('[data-rmabs]').forEach(b=>b.onclick=()=>{const w=work();const c=b.dataset.rmabs;w.absent=w.absent.filter(a=>a.c!==c);for(const k in w.subs)if(k.endsWith('|'+c))delete w.subs[k];A.dirty=true;render()});
  const sv=$('#saveAdj');if(sv)sv.onclick=saveAdj;
  const cl=$('#clrAdj');if(cl)cl.onclick=()=>confirmSheet('Clear this day?','Removes all absent teachers and substitutes for '+longDate(A.date)+'.',async()=>{await write(C_ADJ+'/'+A.date,null);A.draft=null;A.dirty=false;render();toast('Cleared')});
  const cp=$('#cpBtn');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(waText(adj));toast('Copied — paste in the staff group')}catch(e){toast('Select the text below and copy')}};
}

      await write(P_MAIN,d.main||{});await write(P_OV,{cells:d.overrides||{}});for(const k in (d.adjustments||{}))await write(C_ADJ+'/'+k,d.adjustments[k]);toast('Backup restored')}catch(e){toast('Not an SJS Time Table backup')}};i.click()}}
function appLink(withSync){const base=location.origin+location.pathname.replace(/index\.html$/,'');

/* ======================= import routine from the Excel generator ======================= */
const XCOLS=['V','W','X','Y','Z','AA','AB'],SC=['D','F','H','J','L','N','P'],TC=['E','G','I','K','M','O','Q'];
async function parseExcel(file){
  if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',sheets:['Setup','Timetable']});
  const su=wb.Sheets['Setup'],tt=wb.Sheets['Timetable'];
  if(!su||!tt)throw new Error('This is not the Smart Timetable Generator file (no Setup / Timetable sheet).');
  const v=(ws,a)=>{const c=ws[a];return c&&c.v!=null?String(c.v).trim():''};
  const school={name:v(su,'B4'),place:v(su,'B5'),session:v(su,'B6'),incharge:v(su,'B8'),head:v(su,'B9')};
  const teachers=[],classes=[],subjects=[];
  for(let r=5;r<=44;r++){const c=v(su,'E'+r);if(c)teachers.push({c,n:v(su,'F'+r)||c})}
  for(let r=5;r<=26;r++){const c=v(su,'K'+r);if(c)classes.push({c,room:v(su,'L'+r),ct:v(su,'M'+r)})}
  for(let r=5;r<=34;r++){const c=v(su,'Q'+r);if(c)subjects.push({c,n:v(su,'R'+r)||c})}
  const closed=[0,1,2,3,4].map(d=>XCOLS.map(c=>v(su,c+(5+d))));
  const blk=(t,p,b)=>({title:v(su,'B'+t),p:[0,1,2,3,4,5,6].map(i=>v(su,'B'+(p+i))),b:[0,1,2].map(i=>v(su,'B'+(b+i)))});
  let season;
  if(/SEASON/i.test(v(su,'A33')))season={now:v(su,'B34')||'Winter',Summer:blk(37,38,45),Winter:blk(50,51,58)};
  else{const one=blk(7,13,22);season={now:/WINTER/i.test(one.title)?'Winter':'Summer',Summer:one,Winter:one}}
  if(!teachers.length||!classes.length)throw new Error('No teachers or classes found in the Setup sheet.');
  const grid={};let filled=0;
  for(let d=0;d<5;d++)classes.forEach((cl,k)=>{const r=6+22*d+k;const name=v(tt,'B'+r);
    if(name&&name!==cl.c)throw new Error(`Timetable row ${r} is ${name}, expected ${cl.c}. Did the sheet layout change?`);
    grid[`${d}|${cl.c}`]=[0,1,2,3,4,5,6].map(p=>{const s=v(tt,SC[p]+r),t=v(tt,TC[p]+r);if(s)filled++;return[s,t==='?'?'':t]})});
  let clash=0;for(let d=0;d<5;d++)for(let p=0;p<7;p++){if(closed[d][p])continue;const seen={};
    classes.forEach(cl=>codes(grid[`${d}|${cl.c}`][p][1]).forEach(x=>{if(seen[x])clash++;seen[x]=1}))}
  return{data:{school,teachers,classes,subjects,closed,season,grid},filled,clash};
}
let IMP=null;
function vImport(m){
  m.innerHTML=backBtn('Import routine from Excel')+`<div class="card">
   <p class="note" style="margin-top:0">Pick the <b>Smart Timetable Generator</b> file (.xlsm / .xlsx), e.g. <b>…PRACTICE_NA_v6.xlsm</b>. The app reads <b>Setup</b> (school, teachers, classes, rooms, class teachers, subjects, timings, closed periods) and the <b>Timetable</b> sheet, then sends it to every phone.</p>
   <p class="note">Tip: in Excel press <b>Save</b> after Generate, so the file holds the latest routine.</p>
   <button class="btn gold" style="width:100%" id="impPick">📂 Choose Excel file</button>
   <div id="impOut"></div></div>
   ${S.baseInfo?`<div class="card" style="margin-top:12px"><div class="note">In use now: <b>${esc(S.baseInfo.file||'')}</b><br>Imported ${new Date(S.baseInfo.at).toLocaleString('en-IN')}</div>
     <button class="btn ghost" style="width:100%;margin-top:10px" id="impReset">Go back to the built-in routine</button></div>`:''}`;
  bindBack();
  $('#impPick').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.xlsm,.xlsx,.xls';i.onchange=async()=>{const f=i.files[0];if(!f)return;
    $('#impOut').innerHTML='<p class="note" style="margin-top:12px">Reading '+esc(f.name)+' …</p>';
    try{IMP=await parseExcel(f);IMP.file=f.name;const D=IMP.data;
      $('#impOut').innerHTML=`<div class="${IMP.clash?'warn':'ok'}">${esc(f.name)}<br>${D.classes.length} classes · ${D.teachers.length} teachers · ${D.subjects.length} subjects · ${IMP.filled} periods filled${IMP.clash?'<br>⚠ '+IMP.clash+' teacher clash(es) found in this routine':'<br>✓ No teacher clashes'}</div>
       <div class="note" style="margin-top:8px">${esc(D.school.name)} · ${esc(D.season.now)} timing · ${esc((D.season[D.season.now]||{}).title||'')}</div>
       <label class="row" style="margin-top:12px;font-size:13px;font-weight:600"><input type="checkbox" id="impClr" checked> Also clear changes made in the app (rooms, names, timings, edited periods) so the Excel file is used exactly</label>
       <button class="btn gold" style="width:100%;margin-top:12px" id="impGo">Publish this routine to all phones</button>`;
      $('#impGo').onclick=async()=>{const ok=await write(P_BASE,{data:JSON.stringify(IMP.data),file:IMP.file,at:Date.now()});if(!ok)return;
        if($('#impClr').checked){await write(P_MAIN,{});await write(P_OV,{cells:{}})}
        toast('Routine published — every phone now shows '+IMP.file);moreView='home';render()};
    }catch(e){$('#impOut').innerHTML='<div class="warn">'+esc(e.message||'Could not read that file')+'</div>'}};i.click()};
  const rs=$('#impReset');if(rs)rs.onclick=()=>confirmSheet('Use the built-in routine?','The imported Excel routine is removed from all phones.',async()=>{await write(P_BASE,null);toast('Back to the built-in routine');render()});
}

/* ======================= admin auth & writes ======================= */
function adminSignIn(){
  if(S.mode==='online'){
    $('#sheet').innerHTML=`<h3>Admin sign in</h3><p class="note">Use the Admin email and password created in the school's Firebase project.</p>
     <label>Email</label><input class="big" id="aE" type="email" autocomplete="username"><label>Password</label><input class="big" id="aP" type="password" autocomplete="current-password">
     <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" id="aX">Cancel</button><button class="btn gold" style="flex:1.4" id="aGo">Sign in</button></div>`;
    $('#aX').onclick=closeSheet;$('#aGo').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword($('#aE').value.trim(),$('#aP').value);closeSheet();toast('Signed in as Admin')}catch(e){toast('Sign in failed: '+(e.code||'').replace('auth/',''))}};
  } else {
    const pin=LS.get('pin',null);
    $('#sheet').innerHTML=`<h3>${pin?'Admin PIN':'Create Admin PIN'}</h3><p class="note">${pin?'Enter the Admin PIN for this phone.':'Online sync is off, so changes stay on this phone. Choose a 4–8 digit PIN to protect editing.'}</p>
     <input class="big" id="pin" type="password" inputmode="numeric" maxlength="8" style="letter-spacing:6px;text-align:center;font-size:22px">
     <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" id="aX">Cancel</button><button class="btn gold" style="flex:1.4" id="aGo">${pin?'Unlock':'Create PIN'}</button></div>`;
    $('#aX').onclick=closeSheet;$('#aGo').onclick=()=>{const v=$('#pin').value.trim();if(!/^\d{4,8}$/.test(v)){toast('4–8 digits');return}
      const h=hash(v);if(!pin){LS.set('pin',h)}else if(h!==pin){toast('Wrong PIN');return}S.admin=true;LS.set('pinok',true);closeSheet();render();toast('Admin unlocked')};
  }
  showSheet();setTimeout(()=>{const f=$('#sheet input');if(f)f.focus()},150)}
function hash(s){let h=5381;for(const c of 'sjs'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)}
let wq=Promise.resolve();
async function write(path,data){
  if(!S.admin){toast('Only the Admin can change this');return false}
  let ok=false;
  wq=wq.then(async()=>{try{if(data===null)await S.db.doc(path).delete();else await S.db.doc(path).set(data);ok=true}
    catch(e){toast(String(e&&e.code||'').includes('permission')?'Not allowed — this account is not an Admin':'Could not save — check internet')}});
  await wq;return ok}
async function saveMain(patch,msg){const next=Object.assign({},S.main,patch,{updatedAt:Date.now()});const ok=await write(P_MAIN,next);if(ok)toast(msg+' ✓');return ok}
async function saveCell(key,nv){const o={...S.ov};const[d,c,p]=key.split('|');const orig=(BASE.grid[`${d}|${c}`]||[])[p]||['',''];
  if(nv[0]===(orig[0]||'')&&nv[1]===(orig[1]||''))delete o[key];else o[key]=nv;if(await write(P_OV,{cells:o}))toast('Saved — everyone sees it now')}

/* ======================= period editor ======================= */
function openEditor(key){const[d,c,p]=key.split('|');const x=cell(+d,c,+p);const orig=(BASE.grid[`${d}|${c}`]||[])[p]||['',''];
  const teachOf={};for(let dd=0;dd<5;dd++)for(let pp=0;pp<7;pp++){const y=cell(dd,c,pp);if(y.s&&y.t)(teachOf[y.s]=teachOf[y.s]||new Set()).add(y.t)}
  $('#sheet').innerHTML=`<h3>Class ${esc(c)} · ${DAYS[d]} · ${PN[p]}</h3><div class="note">${esc(timing().p[p]||'')} · Excel original: <b>${esc(orig[0]||'—')}</b> / ${esc(orig[1]||'—')}</div>
   <label>Subject</label><select class="big" id="eS"><option value="">— Free / no subject —</option>${subjects().map(s=>`<option value="${esc(s.c)}" ${s.c===x.s?'selected':''}>${esc(s.c)} — ${esc(s.n)}</option>`).join('')}</select>
   <label>Teacher</label><select class="big" id="eT"><option value="">— none —</option>${teachers().map(t=>`<option value="${esc(t.c)}" ${t.c===x.t?'selected':''}>${esc(t.n)} (${esc(t.c)})</option>`).join('')}${x.t&&!TM()[x.t]?`<option value="${esc(x.t)}" selected>${esc(x.t)} (joint)</option>`:''}</select>
   <div id="eSug"></div><div id="eChk"></div>
   <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" id="eX">Cancel</button>${x.changed?'<button class="btn red" id="eO">Original</button>':''}<button class="btn gold" style="flex:1.4" id="eOk">Save</button></div>`;
  const eS=$('#eS'),eT=$('#eT');
  const check=()=>{const s=eS.value,t=eT.value;const sug=[...(teachOf[s]||[])];
    $('#eSug').innerHTML=sug.length?`<div class="note" style="margin-top:10px">Teaches ${esc(s)} to ${esc(c)}:</div><div class="sugg">${sug.map(v=>`<button data-t="${esc(v)}">${esc(tname(v)||v)}</button>`).join('')}</div>`:'';
    $('#eSug').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{let o=[...eT.options].find(o=>o.value===b.dataset.t);if(!o){o=new Option(b.dataset.t+' (joint)',b.dataset.t);eT.add(o)}eT.value=b.dataset.t;check()});
    if(!t){$('#eChk').innerHTML='';return}
    const cl=codes(t).flatMap(code=>busy(code,+d,+p).filter(b=>b.cls!==c).map(b=>`${tfull(code)} is already in ${b.cls} (${b.s})`));
    $('#eChk').innerHTML=cl.length?`<div class="warn">⚠ Clash: ${cl.map(esc).join('<br>')}</div>`:`<div class="ok">✓ ${esc(tname(t))} is free this period.</div>`};
  eS.onchange=check;eT.onchange=check;check();
  $('#eX').onclick=closeSheet;const eo=$('#eO');if(eo)eo.onclick=async()=>{closeSheet();await saveCell(key,[orig[0]||'',orig[1]||''])};
  $('#eOk').onclick=async()=>{closeSheet();await saveCell(key,[eS.value,eT.value])};showSheet()}
function confirmSheet(t,msg,fn){$('#sheet').innerHTML=`<h3>${esc(t)}</h3><p class="note">${esc(msg)}</p><div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" id="cN">Cancel</button><button class="btn red" style="flex:1" id="cY">Yes</button></div>`;
  $('#cN').onclick=closeSheet;$('#cY').onclick=async()=>{closeSheet();await fn()};showSheet()}
function showSheet(){$('#scrim').classList.add('show')}
function closeSheet(){$('#scrim').classList.remove('show')}
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet()};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){savePref('tab',t.dataset.tab);if(t.dataset.tab==='more')moreView='home';closeSheet();render();window.scrollTo({top:0});return}
  const g=e.target.closest('[data-go]');if(g){savePref('tab',g.dataset.go);render();window.scrollTo({top:0});return}
  const sg=e.target.closest('.seg[data-seg] button');if(sg){const k=sg.parentElement.dataset.seg,v=sg.dataset.day;if(v==='w')clsWeek=true;else{selDay[k]=+v;if(k==='cls')clsWeek=false;if(k==='school')schoolP=null}render();return}
  const ed=e.target.closest('[data-edit]');if(ed&&S.admin&&S.edit)openEditor(ed.dataset.edit)});

/* ======================= start ======================= */
function setSync(on,txt){S.live=on;$('#pDot').className='dot'+(on?'':' off');$('#pSync').textContent=txt}
function attach(store){
  S.db=store;
  store.doc(P_BASE).onSnapshot(s=>{const d=s.exists&&s.data();let b=null;try{b=d&&d.data?JSON.parse(d.data):null}catch(e){}
    BASE=(b&&b.grid&&b.classes)?b:EMBED;S.baseInfo=(b&&d)?{file:d.file,at:d.at}:null;render()},()=>{});
  store.doc(P_MAIN).onSnapshot(s=>{S.main=(s.exists&&s.data())||{};render()},()=>{});
  store.doc(P_OV).onSnapshot(s=>{S.ov=((s.exists&&s.data())||{}).cells||{};if(S.mode==='online')setSync(true,'Live');render()},()=>setSync(false,'Saved copy'));
  store.coll(C_ADJ).onSnapshot(q=>{const o={};q.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S.adj=o;render()},()=>{});
}
async function boot(){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(pref.tab==='more')render()});
  window.addEventListener('appinstalled',()=>{S.installEvt=null;toast('SJS Time Table installed')});
  const cfg=fbConfig();
  if(!cfg){S.mode='local';S.admin=!!LS.get('pinok',false);attach(new LocalStore());setSync(false,'This phone');render();return}
  S.mode='online';S.fb=cfg;setSync(false,'Connecting…');render();
  try{const b='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    attach(new FbStore(fs));
    firebase.auth().onAuthStateChanged(u=>{S.user=u;S.admin=!!u;if(!u)S.edit=false;render()});
    setTimeout(()=>{if(!S.live)setSync(false,'Saved copy')},10000);
  }catch(e){S.mode='local';attach(new LocalStore());setSync(false,'Offline');toast('No internet — showing the saved routine')}
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();boot();
setInterval(()=>{header();if(['now','cls','tch'].includes(pref.tab)&&!$('#scrim').classList.contains('show')&&!document.activeElement?.matches('select,input,textarea'))render()},30000);
})();
